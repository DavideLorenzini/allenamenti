name: Aggiorna dashboard

on:
  schedule:
    - cron: "17 */2 * * *"      # ogni 2 ore (orario UTC)
  workflow_dispatch:             # pulsante "Run workflow" per aggiornare a mano
    inputs:
      completo:
        description: "Riscarica tutto lo storico"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: aggiorna-dashboard
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scarica da Garmin e cifra
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python sync.py ${{ inputs.completo && '--completo' || '' }}

      - name: Pubblica se ci sono novità
        run: |
          if git diff --quiet -- docs/data.enc && [ -z "$(git status --porcelain docs/data.enc)" ]; then
            echo "Nessuna modifica."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.enc
          git commit -m "Aggiornamento dati $(date +'%Y-%m-%d %H:%M')"
          git push
